name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Refuse anything but a tag that matches the package version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::publish runs from a version tag, not the $REF_TYPE $REF_NAME"
            exit 1
          fi
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "${REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $REF_NAME does not match the package version $version"
            exit 1
          fi

      - name: Run the test suite, OCR layer included
        run: |
          sudo apt-get update && sudo apt-get install -y tesseract-ocr
          python -m pip install "injection-fixtures @ git+https://github.com/munzzyy/injection-fixtures@039c0e3d5b43b9156b0fe50fbd1027f553a6c078"
          python -m pip install -e ".[dev]"
          python -m pytest -q

      - name: Build sdist and wheel
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Install the built wheel and smoke-test it
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/python -m pip install dist/*.whl
          /tmp/v/bin/python -c "import framewall, framewall.cli"
          /tmp/v/bin/framewall --version

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
