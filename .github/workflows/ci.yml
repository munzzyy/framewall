name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tesseract (Linux only; macOS/Windows run the heuristic subset)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install the injection-fixtures corpus (Linux only; enforces the catch-rate floor)
        if: runner.os == 'Linux'
        run: pip install "injection-fixtures @ git+https://github.com/munzzyy/injection-fixtures@c1bbbca3d6e6dfe909ee2b6224240483a54b03a8"
      - name: Install framewall and test deps
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Smoke-test the CLI end to end
        run: |
          framewall scan examples/clean-screenshot.png --fail-on dangerous
          framewall scan examples/poisoned-screenshot.png --json --fail-on none
